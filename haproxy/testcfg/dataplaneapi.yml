config_version: 2
name: 9553201cdda1
dataplaneapi:
  host: 0.0.0.0
  port: 5555
  advertised:
    api_address: ""
    api_port: 0
  scheme:
  - http
  userlist:
    userlist: dataplaneapi
    userlist_file: ""
  transaction:
    transaction_dir: /var/lib/dataplaneapi/transactions
    backups_number: 10
    backups_dir: /var/lib/dataplaneapi/backups
  resources:
    maps_dir: /etc/haproxy/maps
    ssl_certs_dir: /etc/haproxy/ssl
    general_storage_dir: /etc/haproxy/general
    spoe_dir: /etc/haproxy/spoe
haproxy:
  config_file: /etc/haproxy/haproxy.cfg
  haproxy_bin: /usr/sbin/haproxy
  reload:
    reload_cmd: haproxy -W -D -f /etc/haproxy/haproxy.cfg -p /run/haproxy/haproxy.pid
      -sf $(cat /run/haproxy/haproxy.pid)
    restart_cmd: haproxy -W -D -f /etc/haproxy/haproxy.cfg -p /run/haproxy/haproxy.pid
    reload_strategy: custom
log_targets:
- log_to: stdout
  log_level: info
  log_types:
  - access
  - app
