global
  log stdout format raw local0
  stats socket /run/haproxy/haproxy.sock mode 660 level admin expose-fd listeners
  master-worker

defaults
  mode http
  log global
  timeout connect 5s
  timeout client 50s
  timeout server 50s
  option httplog

frontend stats
  bind *:8404
  stats enable
  stats uri /
  stats refresh 10s

frontend main
  bind *:80
  default_backend app

backend app
  balance roundrobin
  server web1 127.0.0.1:9000 check
  server web2 127.0.0.1:9001 check
