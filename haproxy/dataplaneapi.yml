dataplaneapi:
  host: 0.0.0.0
  port: 5555
  userlist:
    userlist: dataplaneapi
  resources:
    maps_dir: /etc/haproxy/maps
    ssl_certs_dir: /etc/haproxy/ssl
    general_storage_dir: /etc/haproxy/general
    spoe_dir: /etc/haproxy/spoe
  transaction:
    transaction_dir: /var/lib/dataplaneapi/transactions
    backups_number: 10
    backups_dir: /var/lib/dataplaneapi/backups
haproxy:
  config_file: /etc/haproxy/haproxy.cfg
  haproxy_bin: /usr/sbin/haproxy
  reload:
    reload_strategy: custom
    reload_cmd: haproxy -W -D -S /run/haproxy/master.sock -p /run/haproxy/haproxy.pid -f /etc/haproxy/haproxy.cfg -sf $(cat /run/haproxy/haproxy.pid)
    restart_cmd: haproxy -W -D -S /run/haproxy/master.sock -p /run/haproxy/haproxy.pid -f /etc/haproxy/haproxy.cfg
log_targets:
- log_to: stdout
  log_level: info
  log_types:
  - access
  - app
